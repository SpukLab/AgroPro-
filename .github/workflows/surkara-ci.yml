name: SURKARA CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/surkara-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/surkara-ci.yml"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Bootstrap lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- app/package-lock.json && git ls-files --error-unmatch app/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "build: pin SURKARA dependencies"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
