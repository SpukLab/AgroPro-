name: SURKARA Preview Bundle

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/surkara-preview-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build Pages preview
        working-directory: app
        env:
          VITE_BASE_PATH: /AgroPro-/preview/
          VITE_SUPABASE_URL: https://jfztusoibrhopxethefv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DFnUpFVGBttwZ0sQtbV5ug_Ssg2-LtQ
        run: npm run build

      - name: Verify preview paths
        shell: bash
        run: |
          test -f app/dist/index.html
          test -f app/dist/manifest.webmanifest
          grep -q '/AgroPro-/preview/' app/dist/index.html
          grep -q '/AgroPro-/preview/' app/dist/manifest.webmanifest

      - name: Stage static preview
        shell: bash
        run: |
          rm -rf preview
          mkdir -p preview
          cp -R app/dist/. preview/

      - name: Commit preview bundle
        shell: bash
        run: |
          if git diff --quiet -- preview && git ls-files --error-unmatch preview/index.html >/dev/null 2>&1; then
            echo "Preview bundle already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "build: refresh SURKARA Pages preview"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
